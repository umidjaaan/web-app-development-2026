<!DOCTYPE html>
<html lang="ru">
<head>
    {{template "head" .}}
    <title>Добавление — Амфора</title>
    <link rel="stylesheet" href="/resources/styles/import_category_add.css">
</head>
<body class="page page--add">

{{template "topbar" .}}

<main class="add">
{{if .Draft}}
    <!-- ШАГ 2: черновик. Фото и видео сверху (уже выбраны на шаге 1),
         ниже поля по теме и кнопка «Опубликовать» -->
    <h1 class="add__title">Публикация черновика</h1>

    <div class="media">
        <figure class="media__item">
            <img class="media__preview" alt="Фото"
                 src="{{if .Draft.ImageURL}}{{.Draft.ImageURL}}{{else}}/resources/img/default.jpg{{end}}">
            <figcaption class="media__caption">Фото</figcaption>
        </figure>
        <figure class="media__item">
            <video class="media__preview" muted loop autoplay playsinline
                   poster="{{if .Draft.ImageURL}}{{.Draft.ImageURL}}{{else}}/resources/img/default.jpg{{end}}"
                   src="{{if .Draft.VideoURL}}{{.Draft.VideoURL}}{{else}}/resources/video/default.mp4{{end}}"></video>
            <figcaption class="media__caption">Видео</figcaption>
        </figure>
    </div>

    <form class="form" action="/import_categories/{{.Draft.ID}}/publish" method="post">
        <p class="form__name">{{.Draft.Title}}</p>

        <label class="form__label" for="center">Центр производства</label>
        <input class="form__input" type="text" id="center" name="center" value="{{.Draft.ProductionCenter}}">

        <label class="form__label" for="region">Регион-поставщик</label>
        <select class="form__input form__select" id="region" name="region">
            {{range .Regions}}
                <option value="{{.}}"{{if eq . $.Draft.Region}} selected{{end}}>{{.}}</option>
            {{end}}
        </select>

        <label class="form__label" for="shape">Морфологический тип</label>
        <input class="form__input" type="text" id="shape" name="shape" value="{{.Draft.Shape}}">

        <label class="form__label" for="date_start">Дата начала</label>
        <input class="form__input" type="date" id="date_start" name="date_start" required
               min="0001-01-01" max="9999-12-31"
               value="{{if gt .Draft.DateStart.Year 1}}{{.Draft.DateStartInput}}{{end}}">

        <label class="form__label" for="date_end">Дата конца</label>
        <input class="form__input" type="date" id="date_end" name="date_end" required
               min="0001-01-01" max="9999-12-31"
               value="{{if gt .Draft.DateEnd.Year 1}}{{.Draft.DateEndInput}}{{end}}">

        <label class="form__label" for="finds">Число находок</label>
        <input class="form__input" type="number" id="finds" name="finds" min="0" step="1"
               value="{{.Draft.FindsCount}}">

        <label class="form__label" for="diagnostics">Признаки-маркёры</label>
        <textarea class="form__input form__textarea" id="diagnostics" name="diagnostics" rows="3">{{.Draft.Diagnostics}}</textarea>

        <label class="form__label" for="description">Описание</label>
        <textarea class="form__input form__textarea" id="description" name="description" rows="4">{{.Draft.Description}}</textarea>

        <!-- кнопка №2: статус «черновик» → «опубликована» (ORM) -->
        <button class="btn" type="submit">Опубликовать</button>
    </form>
{{else}}
    <!-- ШАГ 1: фото и видео друг под другом с выбором из проводника,
         название и кнопка «Далее» — создаёт черновик -->
    <h1 class="add__title">Новая категория</h1>

    <!-- enctype multipart/form-data нужен, чтобы отправить файлы -->
    <form class="form" action="/import_categories" method="post" enctype="multipart/form-data">
        <div class="media">
            <label class="media__item media__item--pick">
                <span class="media__caption">Фото</span>
                <input class="form__file" type="file" name="image" accept="image/jpeg,image/png,image/webp">
            </label>
            <label class="media__item media__item--pick">
                <span class="media__caption">Видео</span>
                <input class="form__file" type="file" name="video" accept="video/mp4,video/webm">
            </label>
        </div>

        <label class="form__label" for="title">Название</label>
        <input class="form__input" type="text" id="title" name="title" required>

        <!-- кнопка №1: создание черновика (ORM) -->
        <button class="btn" type="submit">Далее</button>
    </form>
{{end}}
</main>

{{template "nav" .}}

</body>
</html>
